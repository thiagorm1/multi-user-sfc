# Edite este arquivo e depois execute ./executar_mappo_qwen.sh
# Para apenas conferir: ./executar_mappo_qwen.sh --check
# Recursos físicos e SLA permanecem no cenário MUVR: 25 servidores, 6 ms.

[execution]
# "train_then_evaluate": treina MAPPO e depois avalia com Qwen.
# "train": somente treinamento; "evaluate": usa um checkpoint já existente.
stage = "train_then_evaluate"
# false protege arquivos de resultados/checkpoints existentes.
# Para outro experimento, prefira alterar os caminhos abaixo.
overwrite = false
threads = 4 # Threads PyTorch; todo o treinamento usa CPU.
model_path = "rl_saved_models/MAPPO_muvr_meu_treino.pt"
output_dir = "results/meu_treino_33_sementes_300"

[training]
episodes = 300       # Episódios MAPPO, diferentes das requisições da avaliação.
demonstrations = 100 # Episódios para produzir demonstrações de alocação.
seed = 137          # Reprodutibilidade do treino; não é a semente da avaliação.
lr_actor = 0.0001    # Taxa de aprendizado dos atores.
lr_critic = 0.0005   # Taxa de aprendizado do crítico centralizado.
clip_param = 0.2    # Limite de clipping da atualização PPO.
ppo_epoch = 4       # Passagens PPO por atualização.
gamma = 0.99        # Desconto das recompensas futuras.
gae_lambda = 0.95   # Parâmetro da estimativa de vantagem GAE.
entropy_coef = 0.01 # Peso da exploração na função de perda.
value_loss_coef = 0.5 # Peso da perda do crítico.
max_grad_norm = 0.5 # Limite da norma do gradiente.
update_every = 5    # Atualiza o MAPPO a cada N episódios.
cloning_epochs = 15 # Passagens de aprendizado a partir das demonstrações.
cloning_batch_size = 128 # Tamanho do lote de demonstrações.

[evaluation]
requests = 300      # Requisições por semente, não simultâneas.
seed_start = 42
seed_count = 33     # 42 até 74: 33 execuções e 9.900 requisições.
search_attempts = 16 # Até 8 tentativas originais + busca adicional com prefixo fixo.

# Peso da penalidade de concentração de CPU/memória no ranking (referência: 2.0).
# Zero remove essa penalidade do ranking; limites físicos e SLA continuam obrigatórios.
load_balance_scale = 0.0

[qwen]
# Qwen é pré-treinado: usado via Ollama, sem treinamento do LLM aqui.
model = "qwen2.5:1.5b"
api_base_url = "http://localhost:11434/v1"
api_timeout = 120.0 # Timeout da consulta em segundo plano, em segundos reais.
max_tokens = 256
planner_interval = 60.0 # Intervalo de atualização em segundos virtuais.
guidance_max_age = 120.0 # Validade da orientação em segundos reais.
